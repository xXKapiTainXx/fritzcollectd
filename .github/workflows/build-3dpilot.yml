name: Build 3D Pilot Android v3.59 SumUp Air

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: 3dpilot-android-v359
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Apply SumUp Air Java sources
        run: |
          python ci-v359-patch.py
          sed -i 's/com\.sumup\.merchant\.reader\.models\.SumUpLogin/com.sumup.merchant.reader.api.SumUpLogin/' app/src/main/java/com/threedpilot/mobile/MainActivity.java
          sed -i 's/com\.sumup\.merchant\.reader\.models\.SumUpPayment/com.sumup.merchant.reader.api.SumUpPayment/' app/src/main/java/com/threedpilot/mobile/MainActivity.java

      - name: Verify v3.59 source markers
        run: |
          grep -F "versionName '3.59'" app/build.gradle
          grep -F "com.sumup:merchant-sdk:7.1.0" app/build.gradle
          grep -F "compose-bom:2026.05.01" app/build.gradle
          grep -F 'com.sumup.merchant.reader.api.SumUpLogin' app/src/main/java/com/threedpilot/mobile/MainActivity.java
          grep -F 'com.sumup.merchant.reader.api.SumUpPayment' app/src/main/java/com/threedpilot/mobile/MainActivity.java
          grep -F 'ThreeDPilotSumUp' app/src/main/java/com/threedpilot/mobile/MainActivity.java
          grep -F 'SumUpState.init(this)' app/src/main/java/com/threedpilot/mobile/PilotApplication.java

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "package:|application-label:|launchable-activity:"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: |
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.threedpilot.mobile
            adb shell am start -W -n com.threedpilot.mobile/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -F 'com.threedpilot.mobile/.MainActivity'
            ! adb logcat -d -b crash | grep -F 'com.threedpilot.mobile'
            echo '3D Pilot v3.59 startup smoke test passed'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Pilot-Android-v3.59-SumUpAir
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
