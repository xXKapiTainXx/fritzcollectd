name: Build 3D Pilot Android

on:
  push:
    branches:
      - tmp-3dpilot-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize logo PNG without changing pixels
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('app/src/main/res/drawable/app_icon.png')
          im = Image.open(p).convert('RGBA')
          im.save(p, format='PNG', compress_level=1)
          print('logo', im.size, im.mode)
          PY

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: 3d-pilot-v3.57-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
