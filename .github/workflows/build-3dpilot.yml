name: Build 3D Pilot Android v3.59 SumUp Air

on:
  push:
    branches:
      - tmp-3dpilot-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: 3dpilot-android-v359
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract 3D Pilot source
        run: |
          rm -rf /tmp/3dpilot-v359
          mkdir -p /tmp/3dpilot-v359
          unzip -q 3dpilot-v359-src.zip -d /tmp/3dpilot-v359
          test -f /tmp/3dpilot-v359/3D-Pilot-Android-v3.59-SumUpAir-Source/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/3dpilot-v359/3D-Pilot-Android-v3.59-SumUpAir-Source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: |
            APK=/tmp/3dpilot-v359/3D-Pilot-Android-v3.59-SumUpAir-Source/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.threedpilot.mobile
            adb shell am start -W -n com.threedpilot.mobile/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -F 'com.threedpilot.mobile/.MainActivity'
            ! adb logcat -d -b crash | grep -F 'com.threedpilot.mobile'
            echo '3D Pilot v3.59 startup smoke test passed'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Pilot-Android-v3.59-SumUpAir
          path: /tmp/3dpilot-v359/3D-Pilot-Android-v3.59-SumUpAir-Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
